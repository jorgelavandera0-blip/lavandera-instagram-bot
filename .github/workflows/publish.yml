name: Publicar en Instagram

# ---------------------------------------------------------------------------
# HORARIOS
# GitHub solo entiende UTC, y Canarias cambia de hora dos veces al ano
# (UTC+1 en verano, UTC+0 en invierno). Para no tener que tocar nada en
# octubre y en marzo se programan los DOS horarios posibles de cada pase, y
# despues el propio job mira la hora real de Canarias y se detiene si no toca.
# Asi los pases caen siempre a las 09:00, 12:00, 16:00, 19:00 y 21:00 de
# Canarias. Cinco al dia.
#
#   Pase 09:00 Canarias -> 08:00 UTC (verano) / 09:00 UTC (invierno)
#   Pase 12:00 Canarias -> 11:00 UTC (verano) / 12:00 UTC (invierno)
#   Pase 16:00 Canarias -> 15:00 UTC (verano) / 16:00 UTC (invierno)
#   Pase 19:00 Canarias -> 18:00 UTC (verano) / 19:00 UTC (invierno)
#   Pase 21:00 Canarias -> 20:00 UTC (verano) / 21:00 UTC (invierno)
#
# ORDEN IMPORTANTE: el video se sube a GitHub ANTES de publicarlo, porque
# Instagram lo descarga desde raw.githubusercontent.com. Si se publicara antes
# de subirlo, Instagram recibiria un 404.
# ---------------------------------------------------------------------------
on:
  schedule:
    # Cada hora, en punto y siete, de 08:07 a 22:07 UTC.
    #
    # Dos cambios respecto a lo de antes, y los dos importan:
    #
    # 1) EL MINUTO. Antes todo salia en el minuto 0, que es el minuto mas
    #    congestionado de GitHub Actions: todo el mundo programa sus cron ahi.
    #    Los retrasos medidos en este repositorio entre el 24 y el 26 de agosto
    #    de 2026 fueron de 15, 18, 19, 34, 35, 36, 39, 46 y 51 minutos. En el
    #    minuto 7 hay mucha menos cola.
    #
    # 2) LA FRECUENCIA. Antes habia un solo disparo por pase: si ese se
    #    retrasaba mas de una hora o GitHub se lo comia, el pase se perdia para
    #    siempre. Ahora hay un disparo cada hora y pase.py sabe que pases se
    #    deben, asi que el siguiente disparo recoge lo que el anterior no hizo.
    #
    # Un disparo que no toca dura unos 16 segundos, asi que sobran de sobra.
    - cron: '7 8 * * *'
    - cron: '7 9 * * *'
    - cron: '7 10 * * *'
    - cron: '7 11 * * *'
    - cron: '7 12 * * *'
    - cron: '7 13 * * *'
    - cron: '7 14 * * *'
    - cron: '7 15 * * *'
    - cron: '7 16 * * *'
    - cron: '7 17 * * *'
    - cron: '7 18 * * *'
    - cron: '7 19 * * *'
    - cron: '7 20 * * *'
    - cron: '7 21 * * *'
    - cron: '7 22 * * *'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Solo comprobar el token (sin publicar)'
        type: boolean
        default: false
      slot:
        description: 'Pase a generar cuando se lanza a mano'
        type: choice
        options: ['09h', '12h', '16h', '19h', '21h']
        default: '12h'
      forzar:
        description: 'Generar un video aunque ya haya cola'
        type: boolean
        default: false

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Decidir que pase toca
        id: pase
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 pase.py --manual "${{ github.event.inputs.slot }}"
          else
            python3 pase.py
          fi

      - name: Decision
        run: echo "${{ steps.pase.outputs.motivo }}"

      - name: Preparar Python
        if: steps.pase.outputs.seguir == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        if: steps.pase.outputs.seguir == 'si'
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      # --- Solo verificar el token ------------------------------------------
      - name: Comprobar el token y salir
        if: ${{ steps.pase.outputs.seguir == 'si' && github.event.inputs.verify_only == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publish.py --verify

      # --- Ciclo normal -----------------------------------------------------
      - name: Generar el video del pase si la cola esta vacia
        if: ${{ steps.pase.outputs.seguir == 'si' && github.event.inputs.verify_only != 'true' }}
        run: |
          if [ "${{ github.event.inputs.forzar }}" = "true" ]; then
            python encolar.py --slot "${{ steps.pase.outputs.slot }}" --forzar
          else
            python encolar.py --slot "${{ steps.pase.outputs.slot }}"
          fi

      - name: Subir el video a GitHub ANTES de publicar
        id: subida
        if: ${{ steps.pase.outputs.seguir == 'si' && github.event.inputs.verify_only != 'true' }}
        run: |
          git config user.name "lavandera-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A posts.json videos fuentes
          if git diff --cached --quiet; then
            echo "Sin cambios que subir (la cola ya tenia video)."
          else
            git commit -m "Pase ${{ steps.pase.outputs.slot }}: videos de Instagram y TikTok listos"
            git pull --rebase --autostash || true
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Esperar a que GitHub sirva el video
        if: ${{ steps.pase.outputs.seguir == 'si' && github.event.inputs.verify_only != 'true' }}
        env:
          VIDEO_REF: ${{ steps.subida.outputs.sha }}
        run: python comprobar_url.py

      - name: Publicar en Instagram
        if: ${{ steps.pase.outputs.seguir == 'si' && github.event.inputs.verify_only != 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          VIDEO_REF: ${{ steps.subida.outputs.sha }}
        run: python publish.py

      - name: Marcar el video como publicado
        if: ${{ steps.pase.outputs.seguir == 'si' && github.event.inputs.verify_only != 'true' }}
        run: |
          git config user.name "lavandera-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A posts.json videos fuentes
          git commit -m "Pase ${{ steps.pase.outputs.slot }}: marcado como publicado" || echo "Sin cambios"
          git pull --rebase --autostash || true
          git push
