name: Publicar en Instagram

# Horarios en UTC. Canarias va +1h en verano (+0h en invierno) — Lavandera Design opera en horario de Canarias.
# 09:00, 13:00 y 19:00 UTC = 10:00, 14:00 y 20:00 en Canarias (verano).
on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:       # permite lanzarlo a mano desde la pestana Actions
    inputs:
      verify_only:
        description: 'Solo comprobar el token (sin publicar)'
        type: boolean
        default: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publicar (o verificar)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.verify_only }}" = "true" ]; then
            python publish.py --verify
          else
            python publish.py
          fi

      - name: Guardar el estado de la cola
        if: ${{ github.event.inputs.verify_only != 'true' }}
        run: |
          git config user.name "lavandera-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts.json
          git commit -m "Marcar video como publicado" || echo "Sin cambios que guardar"
          git push
